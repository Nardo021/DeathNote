buildscript {
    repositories {
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        maven {
            name = 'sonatype'
            url = 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

subprojects { sub ->
    if (sub.name == 'deathnote-platform-api' || sub.name == 'deathnote-core' || sub.name == 'deathnote-config-common') {
        apply plugin: 'java-library'

        repositories {
            mavenCentral()
        }

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
        }
    }
}

apply plugin: 'forge'

version = project.version
group = project.group
archivesBaseName = 'deathnote-forge-1.7.10'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

repositories {
    mavenCentral()
}

project(':deathnote-core') {
    dependencies {
        api project(':deathnote-platform-api')
    }
}

project(':deathnote-config-common') {
    dependencies {
        api project(':deathnote-core')
        implementation "org.yaml:snakeyaml:${snakeyamlVersion}"
    }
}

dependencies {
    compile project(':deathnote-core')
    compile project(':deathnote-config-common')
}

def embedProjects = [':deathnote-core', ':deathnote-platform-api', ':deathnote-config-common']

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    embedProjects.each { path ->
        dependsOn path + ':jar'
        from(zipTree(project(path).jar.archivePath)) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
        }
    }
    manifest {
        attributes(
                'FMLCorePluginContainsFMLMod': 'true',
                'Specification-Title': 'deathnote',
                'Specification-Vendor': 'yaazyy',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
