# DeathNote Forge configuration
input:
  firstPageOnly: true
  firstLineOnly: true
  clearBookAfterUse: true
  consumeOnUse: false

kill:
  delayTicks: 1
  preferMinecraftNamespaceCommand: true
  allowFallbackNativeKill: true
  allowFallbackSetHealth: true

permissions:
  use: deathnote.use
  give: deathnote.give
  admin: deathnote.admin
  bypass: deathnote.bypass

cooldown:
  enabled: true
  seconds: 60

item:
  displayName: "&cDeath Note"

security:
  hmacSecret: ""
  blockSelfTarget: true
  blockOpTarget: true
  debugChatInput: false

recipe:
  enabled: true
  difficultyPreset: hard
