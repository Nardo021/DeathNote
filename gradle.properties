####################################################################
# DeathNote monorepo - shared Gradle properties
####################################################################

# Project coordinates
group   = com.yaazyy.deathnote
version = 1.0.0-SNAPSHOT

# Bukkit / Spigot / Paper API versions used by the plugin line.
# The modern line targets a recent Paper API (Java 17+).
# The legacy + common line compiles against an old, widely available
# Spigot API so that the shared bytecode runs on 1.7.10 - 1.12.2.
modernSpigotApiVersion = 1.20.4-R0.1-SNAPSHOT
legacySpigotApiVersion = 1.8.8-R0.1-SNAPSHOT

# JUnit for the pure-Java unit tests in deathnote-core.
junitVersion = 5.10.2
snakeyamlVersion = 1.33

# Forge versions (modern line wired into root Gradle)
forgeVersion1201 = 1.20.1-47.2.0
forgeVersion1165 = 1.16.5-36.2.39

# Gradle daemon / memory tuning
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
